<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, Newdle!</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 2.2rem;
            color: #3998EB;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #666;
            font-size: 0.9rem;
        }
        .timer {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #3998EB;
            margin-bottom: 1rem;
        }
        main {
            flex: 1;
        }
        .game-container {
            background: white;
            border-radius: 12px;
            padding: 1.2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }
        .guesses {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 1.2rem;
            padding: 0.5rem;
            background: #f5f7fa;
            border-radius: 8px;
        }
        .guess-row {
            display: flex;
            justify-content: center;
            gap: 0.25rem;
            flex-wrap: wrap; 
        }
        .guess-cell {
            width: 2rem;
            height: 2rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            animation: flip 0.5s;
            border: 1px solid transparent; 
        }
        .correct {
            background-color: #69D953; 
            color: white;
            border-color: #57D57E;
        }
        .present {
            background-color: #F5D139; 
            color: #504808; 
            border-color: #E6D342;
        }
        .absent {
            background-color: #9e9e9e; 
            color: white;
            border-color: #888888;
        }
        .excess {
            background-color: #ef5350; 
            color: white;
            border-color: #d32f2f;
        }
        @keyframes flip {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(90deg); background-color: #ddd; } 
            100% { transform: rotateX(0); }
        }
        .input-area {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        input {
            flex: 1;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        button {
            padding: 0.7rem 1rem;
            background: #3998EB;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) {
            background: #2b85d0; 
        }
        button:disabled {
            background: #bdbdbd; 
            cursor: not-allowed;
        }
        .message {
            margin: 0.8rem 0;
            padding: 0.8rem;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease-out, background-color 0.3s, color 0.3s;
            min-height: 1.5em; 
        }
        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
            opacity: 1;
        }
        .error {
            background-color: #ffebee;
            color: #c62828;
            opacity: 1;
        }
        .easter-egg {
            background-color: #e3f2fd;
            color: #1565c0;
            opacity: 1;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #666;
        }
        .toolbar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .toolbar button {
            flex: 1;
            min-width: 100px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); 
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 1rem; 
        }
        .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            width: 90%;
            max-width: 450px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            max-height: 90vh; 
            overflow-y: auto; 
        }
        .modal-title {
            font-size: 1.3rem; 
            font-weight: 600;
            margin-bottom: 1rem;
            color: #3998EB;
            text-align: center;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
        #resultContent .result-grid {
            font-family: 'Courier New', Courier, monospace; 
            line-height: 1.3;
            font-size: 1.1rem; 
            background: #f8f8f8;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto; 
            text-align: center; 
            margin: 1rem 0;
        }
        #resultContent .result-url {
            font-size: 0.85rem;
            color: #555;
            word-break: break-all; 
            margin-top: 1rem;
            text-align: center;
        }
        #resultContent .result-summary {
            font-weight: 500;
            text-align: center;
            margin-bottom: 1rem;
        }
        footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #888;
        }
        @media (max-width: 480px) {
             h1 { font-size: 1.8rem; }
            .guess-cell {
                width: 1.8rem;
                height: 1.8rem;
                font-size: 0.8rem;
            }
            .toolbar {
                flex-direction: column;
            }
            .input-area {
                flex-direction: column;
            }
            input, button {
                width: 100%;
            }
            .modal-content {
                 padding: 1rem;
            }
            .modal-title {
                 font-size: 1.1rem;
            }
            #resultContent .result-grid {
                 font-size: 0.9rem; 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>뉴들</h1>
            <div class="subtitle">Newddle</div>
        </header>
        <div class="timer" id="timer">00:00</div>
        <main>
            <div class="game-container">
                <div class="guesses" id="guesses">
                </div>
                <div class="input-area">
                    <input type="text" id="guessInput" placeholder="정답을 입력하세요" autocomplete="off">
                    <button id="submitBtn">제출</button>
                </div>
                <div class="message" id="message"></div>
                <div class="stats">
                    <div id="guessCount">시도: 0</div>
                    <div id="gameMode">기본 모드</div>
                </div>
            </div>
            <div class="toolbar">
                <button id="customBtn">커스텀 단어</button>
                <button id="shareBtn" disabled>결과 공유</button> 
                <button id="resetBtn">새 게임</button>
            </div>
        </main>
        <footer>
            Made by Ziyun
        </footer>
    </div>
    <div class="modal" id="customModal">
        <div class="modal-content">
            <div class="modal-title">커스텀 단어 설정</div>
            <p style="font-size: 0.9rem; color: #555; margin-bottom: 1rem;">게임을 만들 단어를 입력하세요. 생성된 URL을 친구에게 공유하여 게임에 도전하게 할 수 있습니다.</p>
            <input type="text" id="customWordInput" placeholder="커스텀 단어 입력" style="width: 100%; margin: 1rem 0; padding: 0.7rem; border: 1px solid #ccc; border-radius: 6px;">
             <div class="modal-actions">
                 <button id="cancelCustom" style="background-color: #757575;">취소</button>
                <button id="saveCustom">URL 생성 및 복사</button>
            </div>
        </div>
    </div>
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-title">게임 결과</div>
            <div id="resultContent" style="margin-bottom: 1rem;">
            </div>
            <div class="modal-actions">
                <button id="closeResult" style="background-color: #757575;">닫기</button>
                <button id="copyResult">클립보드에 복사</button>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let targetWord = "별 밤 (On the way)";
            let guessCount = 0;
            let gameOver = false;
            let startTime = new Date();
            let elapsedTime = 0;
            let timerInterval;
            let isCustomMode = false;
            let allGuessResults = [];
            const guessesContainer = document.getElementById('guesses');
            const guessInput = document.getElementById('guessInput');
            const submitBtn = document.getElementById('submitBtn');
            const messageEl = document.getElementById('message');
            const guessCountEl = document.getElementById('guessCount');
            const timerEl = document.getElementById('timer');
            const gameModeEl = document.getElementById('gameMode');
            const customBtn = document.getElementById('customBtn');
            const shareBtn = document.getElementById('shareBtn');
            const resetBtn = document.getElementById('resetBtn');
            const customModal = document.getElementById('customModal');
            const customWordInput = document.getElementById('customWordInput');
            const saveCustomBtn = document.getElementById('saveCustom');
            const cancelCustomBtn = document.getElementById('cancelCustom');
            const resultModal = document.getElementById('resultModal');
            const resultContent = document.getElementById('resultContent');
            const copyResultBtn = document.getElementById('copyResult');
            const closeResultBtn = document.getElementById('closeResult');
            function encodeBase64(str) {
                try {
                    return btoa(unescape(encodeURIComponent(str)));
                } catch (e) {
                    console.error("Base64 인코딩 오류:", e);
                    return "";
                }
            }
            function decodeBase64(str) {
                try {
                    const base64 = str.replace(/-/g, '+').replace(/_/g, '/');
                    const padding = '='.repeat((4 - base64.length % 4) % 4);
                    return decodeURIComponent(escape(atob(base64 + padding)));
                } catch (e) {
                    console.error("Base64 디코딩 오류:", e, "입력값:", str);
                    return "디코딩오류";
                }
            }
            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
             const countEasterEggs = {
                 5: "조금만 더 노력해보세용.",
                 10: "렛츠끼릿",
                 20: "힘들지않아거친세상속에뛰어든건너니까 유오케",
                 30: "포기는 배추셀때만하는것.",
                 50: "대단...",
                 83: "내생일 20100803♡",
                 100: "당신을 레전드로 임명합니다"
             };
             const wordEasterEggs = {
                 "사랑": "♡",
                 "포기": "하지마!! 유캔두잇"
             };
            function initializeGame() {
                 const urlParams = new URLSearchParams(window.location.search);
                 if (urlParams.has('word')) {
                     const encodedWord = urlParams.get('word');
                     const decodedWord = decodeBase64(encodedWord);
                     if (decodedWord && decodedWord !== "디코딩오류") {
                         targetWord = decodedWord;
                         isCustomMode = true;
                         gameModeEl.textContent = "커스텀 모드";
                         console.log("커스텀 모드 로드됨. 정답:", targetWord);
                     } else {
                         showMessage('커스텀 단어 로딩 실패!', 'error');
                         gameModeEl.textContent = "기본 모드";
                     }
                 } else {
                     isCustomMode = false;
                     gameModeEl.textContent = "기본 모드";
                 }
                 resetGame();
                 startTimer();
                 guessInput.focus();
             }
            function resetGame() {
                guessCount = 0;
                gameOver = false;
                allGuessResults = [];
                guessesContainer.innerHTML = '';
                guessCountEl.textContent = `시도: 0`;
                guessInput.value = '';
                guessInput.disabled = false;
                submitBtn.disabled = false;
                shareBtn.disabled = true;
                messageEl.className = 'message';
                messageEl.textContent = '';
                clearInterval(timerInterval);
                startTime = new Date();
                elapsedTime = 0;
                timerEl.textContent = '00:00';
                startTimer();
                const existingCongrats = document.querySelector('.congrats-message');
                if (existingCongrats) {
                    existingCongrats.remove();
                }
                guessInput.focus();
            }
            function startTimer() {
                clearInterval(timerInterval);
                timerInterval = setInterval(function() {
                    if (!gameOver) {
                        const now = new Date();
                        elapsedTime = Math.floor((now - startTime) / 1000);
                        timerEl.textContent = formatTime(elapsedTime);
                    } else {
                        clearInterval(timerInterval);
                    }
                }, 1000);
            }
             function showMessage(text, type, duration = 3000) {
                 messageEl.textContent = text;
                 messageEl.className = 'message';
                 void messageEl.offsetWidth;
                 messageEl.classList.add(type);
                 messageEl.style.opacity = '1';
                 if (type !== 'success') {
                     setTimeout(() => {
                         messageEl.style.opacity = '0';
                         setTimeout(() => {
                             if (messageEl.textContent === text) {
                                 messageEl.className = 'message';
                                 messageEl.textContent = '';
                             }
                         }, 300);
                     }, duration);
                 }
             }
             function submitGuess() {
                 if (gameOver) return;
                 const guess = guessInput.value.trim();
                 if (!guess) {
                     showMessage('단어를 입력해주세요!', 'error', 2000);
                     return;
                 }
                 guessCount++;
                 guessCountEl.textContent = `시도: ${guessCount}`;
                 const guessRow = document.createElement('div');
                 guessRow.className = 'guess-row';
                 const results = new Array(Math.max(guess.length, targetWord.length)).fill(null);
                 const targetLetters = targetWord.split('');
                 const guessLetters = guess.split('');
                 const currentGuessStatuses = [];
                 const displayLength = Math.max(guess.length, targetWord.length);
                 for (let i = 0; i < displayLength; i++) {
                     if (i < guess.length && i < targetLetters.length && guessLetters[i] === targetLetters[i]) {
                         results[i] = 'correct';
                         targetLetters[i] = null;
                         guessLetters[i] = null;
                     }
                 }
                 for (let i = 0; i < displayLength; i++) {
                     if (results[i] === null && i < guess.length && guessLetters[i] !== null) {
                         if (i < targetWord.length) {
                             const presentIndex = targetLetters.indexOf(guessLetters[i]);
                             if (presentIndex !== -1) {
                                 results[i] = 'present';
                                 targetLetters[presentIndex] = null;
                                 guessLetters[i] = null;
                             }
                         }
                     }
                 }
                 for (let i = 0; i < displayLength; i++) {
                    let status = '';
                    if (results[i] !== null) {
                        status = results[i];
                    } else {
                        if (i < guess.length) {
                            if (i < targetWord.length) {
                                status = 'absent';
                            } else {
                                status = 'excess';
                            }
                        } else {
                           status = 'absent';
                        }
                    }
                    results[i] = status;
                    currentGuessStatuses.push(status);
                 }
                 for (let i = 0; i < displayLength; i++) {
                     const cell = document.createElement('div');
                     cell.className = 'guess-cell';
                     cell.style.animationDelay = `${i * 0.07}s`;
                     if (i < guess.length) {
                         cell.textContent = guess[i];
                     } else {
                         cell.textContent = '';
                     }
                     cell.classList.add(results[i]);
                     guessRow.appendChild(cell);
                 }
                 allGuessResults.push(currentGuessStatuses);
                 guessesContainer.appendChild(guessRow);
                 guessesContainer.scrollTop = guessesContainer.scrollHeight;
                 guessInput.value = '';
                 guessInput.focus();
                 if (guess === targetWord) {
                     gameOver = true;
                     clearInterval(timerInterval);
                     showMessage(`정답입니다. ${guessCount}번 만에 성공! 🎉`, 'success', 5000);
                     guessInput.disabled = true;
                     submitBtn.disabled = true;
                     shareBtn.disabled = false;
                     celebrateWin();
                 } else {
                     if (countEasterEggs[guessCount]) {
                         setTimeout(() => showMessage(countEasterEggs[guessCount], 'easter-egg'), 600);
                     }
                     for (const [word, message] of Object.entries(wordEasterEggs)) {
                         if (guess.includes(word)) {
                             setTimeout(() => showMessage(message, 'easter-egg'), 800);
                             break;
                         }
                     }
                 }
             }
             function celebrateWin() {
                 const existingCongrats = document.querySelector('.congrats-message');
                 if (existingCongrats) existingCongrats.remove();
                 const formattedTime = formatTime(elapsedTime);
                 const congratsText = document.createElement('div');
                 congratsText.className = 'congrats-message';
                 congratsText.innerHTML = `<strong>${guessCount}번</strong> 시도, <strong>${formattedTime}</strong> 만에 성공! 🎊`;
                 congratsText.style.cssText = `
                     font-size: 1.1rem;
                     text-align: center;
                     margin: 1rem 0 0; 
                     color: #388e3c; 
                     font-weight: 600;
                 `;
                 document.querySelector('.game-container .stats').insertAdjacentElement('afterend', congratsText);
             }
             function generateShareableResultHtml() {
                 const colorMap = {
                                        correct: '<font color=#69d953>█</font>',
                    present: '<font color=#f5d139>█</font>',
                    absent:  '<font color=#9e9e9e>█</font>',
                    excess:  '<font color=#ef5350>█</font>',
                 };
                 let gridHtml = '';
                 allGuessResults.forEach(row => {
                     row.forEach(status => {
                         gridHtml += colorMap[status] || colorMap['absent'];
                     });
                     gridHtml += '<br>';
                 });
                 return gridHtml;
             }
             function generateShareableResultPlainText() {
                 const title = `뉴들 ${isCustomMode ? '(커스텀)' : ''} ${guessCount}/${allGuessResults.length} | ⏱️${formatTime(elapsedTime)}`;
                 const plainBlockMap = {
                    correct: '<font color=6543440>█</font>',
                    present: '<font color=16373577>█</font>',
                    absent:  '<font color=10395294>█</font>',
                    excess:  '<font color=16403275>█</font>',
                 };
                 let gridPlainText = '';
                 allGuessResults.forEach(row => {
                     row.forEach(status => {
                         gridPlainText += plainBlockMap[status] || plainBlockMap['absent'];
                     });
                     gridPlainText += '\n';
                 });
                 const currentUrl = `${window.location.origin}${window.location.pathname}${window.location.search}`;
                 return `${title}\n\n${gridPlainText}\n${currentUrl}`;
             }
             submitBtn.addEventListener('click', submitGuess);
             guessInput.addEventListener('keypress', function(e) {
                 if (e.key === 'Enter') {
                     submitGuess();
                 }
             });
             customBtn.addEventListener('click', function() {
                 customModal.style.display = 'flex';
                 customWordInput.value = '';
                 customWordInput.focus();
             });
             saveCustomBtn.addEventListener('click', function() {
                 const word = customWordInput.value.trim();
                 if (word && word.length > 0) {
                     if (word.length > 30) {
                         alert('단어가 너무 깁니다. 30자 이하로 입력해주세요.');
                         return;
                     }
                     const encodedWord = encodeBase64(word);
                     if (!encodedWord) {
                         alert('단어 인코딩 중 오류가 발생했습니다.');
                         return;
                     }
                     const url = `${window.location.origin}${window.location.pathname}?word=${encodedWord}`;
                     navigator.clipboard.writeText(url).then(() => {
                         alert(`URL이 클립보드에 복사되었습니다!\n${url}\n\n이 URL을 친구에게 공유하세요! Letgo`);
                         customModal.style.display = 'none';
                     }).catch(err => {
                         console.error('URL 복사 실패:', err);
                         alert('URL 복사에 실패했습니다. 왜지?? 수동으로 복사해주세요.ㅎㅎ:\n' + url);
                     });
                 } else {
                     alert('유효한 단어를 입력하세요.');
                 }
             });
             cancelCustomBtn.addEventListener('click', () => customModal.style.display = 'none');
             closeResultBtn.addEventListener('click', () => resultModal.style.display = 'none');
             shareBtn.addEventListener('click', function() {
                 if (!gameOver) return;
                 const formattedTime = formatTime(elapsedTime);
                 const summaryText = `뉴들 ${isCustomMode ? '(커스텀)' : ''} ${guessCount}번 시도, ${formattedTime} 만에 해결!`;
                 const gridHtml = generateShareableResultHtml();
                 const currentUrl = `${window.location.origin}${window.location.pathname}${window.location.search}`;
                 resultContent.innerHTML = `
                     <div class="result-summary">${summaryText}</div>
                     <div class="result-grid">${gridHtml}</div>
                     <div class="result-url">${currentUrl}</div>
                 `;
                 resultModal.style.display = 'flex';
             });
            copyResultBtn.addEventListener('click', function() {
                const plainTextResult = generateShareableResultPlainText();
                navigator.clipboard.writeText(plainTextResult).then(() => {
                    alert('결과가 클립보드에 복사되었습니다! (텍스트 형식)');
                }).catch(err => {
                    console.error('클립보드 복사 오류:', err);
                    try {
                        const textArea = document.createElement('textarea');
                        textArea.value = plainTextResult;
                        textArea.style.position = 'fixed';
                        textArea.style.left = '-9999px';
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        alert('결과가 클립보드에 복사되었습니다! (텍스트 - Fallback)');
                    } catch (execErr) {
                        console.error('Fallback 복사 오류:', execErr);
                        alert('클립보드 복사에 실패했습니다.');
                    }
                });
            });
             resetBtn.addEventListener('click', function() {
                 if (confirm('현재 게임 진행 상황이 초기화됩니다.\n 새 게임을 시작하시겠습니까?')) {
                     if (isCustomMode) {
                         window.location.href = window.location.pathname;
                     } else {
                         resetGame();
                     }
                 }
             });
             window.addEventListener('click', function(e) {
                 if (e.target === customModal) customModal.style.display = 'none';
                 if (e.target === resultModal) resultModal.style.display = 'none';
             });
            initializeGame();
        });
    </script>
</body>
</html>
